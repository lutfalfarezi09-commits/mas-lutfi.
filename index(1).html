<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kasir Kedai Makan Susanto</title>
<style>
:root{--green:#16794b;--dark:#173b2b;--bg:#f4f7f4;--line:#e3e9e4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#1c2921}
header{background:var(--dark);color:white;padding:22px 16px}
header h1{margin:0;font-size:23px}header p{margin:5px 0 0;color:#d5e7dc;font-size:13px}
main{max-width:900px;margin:18px auto;padding:0 13px 40px;display:grid;gap:15px}
.card{background:white;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 3px 12px #193c2610}
h2{font-size:18px;margin:0 0 13px}.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.item strong{display:block;font-size:14px}.item small{color:#637268}.item button,.primary{border:0;background:var(--green);color:white;border-radius:9px;padding:10px 13px;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:9px}.qty button{width:28px;height:28px;border:1px solid var(--line);background:#f7faf7;border-radius:8px;font-size:17px}
.total{font-size:22px;font-weight:800;color:var(--green)}
input{width:100%;padding:12px;border:1px solid #cfd9d1;border-radius:9px;font-size:16px;margin:6px 0 12px}
.primary{width:100%;padding:13px;font-size:16px}.muted{color:#6b786f;font-size:13px}.receipt{white-space:pre-wrap;background:#f7faf7;border-radius:10px;padding:12px;font-family:monospace;font-size:13px}
.history-entry{font-size:13px;border-bottom:1px solid var(--line);padding:9px 0}
@media(min-width:700px){main{grid-template-columns:1.1fr .9fr}.wide{grid-column:1/-1}.menu{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<header><h1>🍽️ Kedai Makan Susanto</h1><p>Kasir sederhana • Menu masakan Indonesia</p></header>
<main>
<section class="card">
<h2>Daftar Menu</h2>
<div class="menu" id="menu"></div>
<p class="muted">Harga dapat diubah melalui tombol Kelola Menu.</p>
<button class="primary" style="background:#52645a" onclick="manageMenu()">Kelola Menu</button>
</section>
<section class="card">
<h2>Pesanan</h2><div id="cart"><p class="muted">Belum ada pesanan.</p></div>
<div class="row"><strong>Total</strong><span class="total" id="total">Rp0</span></div>
<label for="cash"><strong>Uang diterima (Rp)</strong></label>
<input id="cash" type="number" inputmode="numeric" placeholder="Contoh: 50000">
<div class="row"><strong>Kembalian</strong><strong id="change">Rp0</strong></div>
<button class="primary" onclick="checkout()">Selesaikan Transaksi</button>
</section>
<section class="card wide">
<h2>Struk Terakhir</h2><div id="receipt" class="receipt">Struk akan muncul setelah transaksi selesai.</div>
</section>
<section class="card wide">
<h2>Riwayat Transaksi</h2><div id="history"><p class="muted">Belum ada transaksi.</p></div>
</section>
</main>
<script>
const rupiah=n=>'Rp'+Number(n||0).toLocaleString('id-ID');
let menu=JSON.parse(localStorage.getItem('kms_menu')||'null')||[
{name:'Nasi putih',price:5000},{name:'Ayam goreng',price:10000},{name:'Telur balado',price:5000},
{name:'Tempe orek',price:3000},{name:'Tumis kangkung',price:4000},{name:'Ikan goreng',price:10000},
{name:'Sambal',price:2000},{name:'Paket nasi + 3 lauk',price:20000}
];
let cart={},history=JSON.parse(localStorage.getItem('kms_history')||'[]');
function save(){localStorage.setItem('kms_menu',JSON.stringify(menu));localStorage.setItem('kms_history',JSON.stringify(history))}
function renderMenu(){document.getElementById('menu').innerHTML=menu.map((m,i)=>`<div class="item"><div><strong>${m.name}</strong><small>${rupiah(m.price)}</small></div><button onclick="add(${i})">Tambah</button></div>`).join('')}
function add(i){cart[i]=(cart[i]||0)+1;renderCart()}
function changeQty(i,d){cart[i]=(cart[i]||0)+d;if(cart[i]<=0)delete cart[i];renderCart()}
function sum(){return Object.entries(cart).reduce((s,[i,q])=>s+menu[i].price*q,0)}
function renderCart(){let entries=Object.entries(cart);document.getElementById('cart').innerHTML=entries.length?entries.map(([i,q])=>`<div class="row"><div><strong>${menu[i].name}</strong><div class="muted">${rupiah(menu[i].price)} × ${q}</div></div><div class="qty"><button onclick="changeQty(${i},-1)">−</button>${q}<button onclick="changeQty(${i},1)">+</button></div></div>`).join(''):'<p class="muted">Belum ada pesanan.</p>';document.getElementById('total').textContent=rupiah(sum());calcChange()}
function calcChange(){let c=Number(document.getElementById('cash').value||0)-sum();document.getElementById('change').textContent=rupiah(Math.max(0,c))}
document.getElementById('cash').addEventListener('input',calcChange);
function checkout(){let total=sum(),cash=Number(document.getElementById('cash').value||0);if(!total)return alert('Pilih menu terlebih dahulu.');if(cash<total)return alert('Uang diterima belum cukup.');let lines=Object.entries(cart).map(([i,q])=>`${menu[i].name} x${q}  ${rupiah(menu[i].price*q)}`);let date=new Date().toLocaleString('id-ID');let receipt=`KEDAI MAKAN SUSANTO\n${date}\n--------------------------\n${lines.join('\n')}\n--------------------------\nTOTAL      ${rupiah(total)}\nDIBAYAR    ${rupiah(cash)}\nKEMBALIAN  ${rupiah(cash-total)}\nTerima kasih!`;document.getElementById('receipt').textContent=receipt;history.unshift({date,total,receipt});save();renderHistory();cart={};document.getElementById('cash').value='';renderCart()}
function renderHistory(){document.getElementById('history').innerHTML=history.length?history.slice(0,30).map(h=>`<div class="history-entry"><strong>${h.date}</strong> — ${rupiah(h.total)}<br><button style="margin-top:5px" onclick="showReceipt(${history.indexOf(h)})">Lihat struk</button></div>`).join(''):'<p class="muted">Belum ada transaksi.</p>'}
function showReceipt(i){document.getElementById('receipt').textContent=history[i].receipt}
function manageMenu(){let name=prompt('Nama menu baru:');if(!name)return;let price=Number(prompt('Harga menu (angka saja):'));if(!price||price<1)return alert('Harga tidak valid.');menu.push({name,price});save();renderMenu()}
renderMenu();renderCart();renderHistory();
</script>
</body></html>
